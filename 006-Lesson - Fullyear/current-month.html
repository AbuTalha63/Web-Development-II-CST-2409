<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./js/include.js"></script>
    <script src="./current-month.js"></script>
    <link rel="stylesheet" href="current-month.css" type="text/css">
</head>
<body>
    <p>Developer: Usman, Muhammad</p>
    <div w3-include-html="./xml/template.xml"></div>
    <span id="developer"Usman, Muhammad></span>
    <script>
        function updateMonth(element) {
            let caption = element.querySelector("caption");
            caption.innerText = getMonth();
            const tds = [...element.querySelectorAll("td")];
            let firstDay = getFirstDay();
            let dayNumber = 1;
            let lastDay = getLastDay();
            tds.forEach((e,i) => {
                if (firstDay <= i && lastDay >= dayNumber)
                e.innerHTML = dayNumber++ + "<span>$100</span>";
            });
        }

        includeHTML(updateMonth);
    </script>
</body>
</html>
